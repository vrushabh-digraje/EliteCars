<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <meta charset="UTF-8">
    <title>Book Vehicle - EliteCars</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CDNs -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-primary: #06070a; /* Midnight Obsidian */
            --bg-secondary: #0d0e15; /* Carbon Deep Slate */
            --bg-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.06);
            --accent-indigo: #6366f1; /* Electric Indigo */
            --accent-cyan: #06b6d4; /* Cyber Cyan */
            --accent-indigo-hover: #4f46e5;
            --accent-cyan-hover: #0891b2;
            --text-main: #f8fafc; /* Slate-50 */
            --text-muted: #94a3b8; /* Slate-400 */
            --font-display: 'Plus Jakarta Sans', sans-serif;
            --font-sans: 'Inter', sans-serif;
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc; /* Slate-50 */
            --bg-secondary: #ffffff; /* White */
            --bg-glass: rgba(0, 0, 0, 0.02);
            --border-glass: rgba(0, 0, 0, 0.08);
            --accent-indigo: #4f46e5; /* Indigo-600 */
            --accent-cyan: #0891b2; /* Cyber Cyan-600 */
            --accent-indigo-hover: #4338ca;
            --accent-cyan-hover: #0e7490;
            --text-main: #0f172a; /* Slate-900 */
            --text-muted: #475569; /* Slate-600 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
            position: relative;
        }

        .text-muted {
            color: var(--text-muted) !important;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(6, 182, 212, 0.05) 0%, transparent 65%),
                        url('https://images.unsplash.com/photo-1617788138017-80ad40651399?q=80&w=1920') no-repeat center center;
            background-size: cover;
            opacity: 0.12;
            z-index: 0;
        }

        /* Floating Back Button */
        .btn-back {
            position: absolute;
            top: 30px;
            left: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            z-index: 10;
            font-size: 15px;
        }

        .btn-back:hover {
            color: var(--accent-cyan);
            transform: translateX(-3px);
        }

        .booking-box {
            position: relative;
            z-index: 1;
            width: 520px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(20px);
            padding: 45px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .booking-box h2 {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 32px;
            letter-spacing: -1.5px;
            margin-bottom: 8px;
            background: linear-gradient(to right, var(--text-main) 70%, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .booking-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 35px;
            text-align: center;
        }

        /* Forms */
        .form-label {
            font-weight: 500;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group-text {
            background-color: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-right: none;
            color: var(--text-muted);
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }

        .form-control {
            background-color: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control[readonly] {
            background-color: var(--bg-glass);
            border-color: var(--border-glass);
            color: var(--text-muted);
            opacity: 0.8;
        }

        .form-control:focus:not([readonly]) {
            background-color: var(--bg-glass);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
            color: var(--text-main);
        }

        /* Calculation Summary Card */
        .summary-card {
            background-color: rgba(6, 182, 212, 0.02);
            border: 1px dashed rgba(6, 182, 212, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .summary-row:last-child {
            margin-bottom: 0;
            padding-top: 8px;
            border-top: 1px solid var(--border-glass);
            color: var(--text-main);
            font-weight: 700;
            font-size: 16px;
        }

        /* Indigo-Cyan CTA Button */
        .btn-gold {
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-cyan));
            color: #ffffff !important;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            padding: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
            background: linear-gradient(135deg, var(--accent-indigo-hover), var(--accent-cyan-hover));
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<!-- Floating Back Button -->
<a href="user-dashboard.html" class="btn-back">
    <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
</a>

<div class="booking-box">
    <h2>Book Your Vehicle</h2>
    <p class="booking-subtitle">Confirm your travel schedule and rent terms.</p>

    <form action="../bookCar" method="post">
        <!-- User ID -->
        <div class="mb-3">
            <label class="form-label">Session Account Verification</label>
            <div class="input-group">
                <span class="input-group-text text-info"><i class="fa-solid fa-user-check"></i></span>
                <input type="number" name="userId" class="form-control" value="1" readonly style="pointer-events: none; opacity: 0.85;">
            </div>
            <small class="text-success d-block mt-2" style="font-size: 11px; letter-spacing: 0.2px;">
                <i class="fa-solid fa-circle-check me-1"></i> Active login session auto-detected and verified.
            </small>
        </div>

        <!-- Car Name (Readonly) -->
        <div class="mb-3">
            <label class="form-label">Selected Car</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-car"></i></span>
                <input type="text" id="carName" class="form-control" readonly>
            </div>
        </div>

        <!-- Hidden Car ID -->
        <input type="hidden" id="carId" name="carId">

        <!-- Price Per Day (Readonly) -->
        <div class="mb-3">
            <label class="form-label">Rental Price</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-indian-rupee-sign"></i></span>
                <input type="text" id="price" class="form-control" readonly>
            </div>
        </div>

        <!-- Pickup Date -->
        <div class="mb-3">
            <label class="form-label">Pickup Date</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-calendar-days"></i></span>
                <input type="date" id="pickupDate" name="pickupDate" class="form-control" required>
            </div>
        </div>

        <!-- Return Date -->
        <div class="mb-4">
            <label class="form-label">Return Date</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-calendar-check"></i></span>
                <input type="date" id="returnDate" name="returnDate" class="form-control" required>
            </div>
        </div>

        <!-- Calculation summary -->
        <div class="summary-card">
            <div class="summary-row">
                <span>Rental Duration:</span>
                <span id="rentalDays">0 days</span>
            </div>
            <div class="summary-row">
                <span>Total Rent Amount:</span>
                <span>₹<span id="displayAmount">0</span></span>
            </div>
        </div>

        <!-- Hidden inputs for form submit matching schema -->
        <input type="hidden" id="totalAmount" name="totalAmount" value="0">

        <!-- Button -->
        <button type="submit" class="btn btn-gold w-100 mt-2">Confirm Booking</button>
    </form>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const carId = params.get("carId");
    const price = params.get("price");
    const carName = params.get("carName");

    // Check if error parameter exists
    if (params.get("error") === "unavailable") {
        const errorAlert = document.createElement("div");
        errorAlert.className = "alert alert-danger text-center mb-4";
        errorAlert.style.borderRadius = "12px";
        errorAlert.style.fontSize = "14px";
        errorAlert.innerHTML = "<i class='fa-solid fa-triangle-exclamation me-2'></i> This vehicle is already booked for the selected dates. Please choose a different date range or vehicle.";
        document.querySelector("form").prepend(errorAlert);
    }

    // Set Values
    document.getElementById("carId").value = carId;
    document.getElementById("price").value = price;
    document.getElementById("carName").value = decodeURIComponent(carName || '');

    // Auto Calculate Total Amount
    const pickup = document.getElementById("pickupDate");
    const ret = document.getElementById("returnDate");

    pickup.addEventListener("change", calculateAmount);
    ret.addEventListener("change", calculateAmount);

    // Set min date to today
    const today = new Date().toISOString().split('T')[0];
    pickup.setAttribute('min', today);
    ret.setAttribute('min', today);

    // Auto-fill dates from sessionStorage if stored from homepage search widget
    const savedPickup = sessionStorage.getItem('pickupDate');
    const savedReturn = sessionStorage.getItem('returnDate');
    if (savedPickup && savedPickup >= today) {
        pickup.value = savedPickup;
        ret.setAttribute('min', savedPickup);
    }
    if (savedReturn && savedReturn >= today && (!savedPickup || savedReturn >= savedPickup)) {
        ret.value = savedReturn;
    }
    calculateAmount();

    function calculateAmount() {
        if (!pickup.value) return;
        
        // Ensure return date min is set to pickup date
        ret.setAttribute('min', pickup.value);

        if (!ret.value) return;

        const pickupDate = new Date(pickup.value);
        const returnDate = new Date(ret.value);
        
        const diffTime = returnDate - pickupDate;
        const days = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (days > 0) {
            const total = days * parseFloat(price);
            document.getElementById("totalAmount").value = total;
            document.getElementById("displayAmount").textContent = total.toLocaleString();
            document.getElementById("rentalDays").textContent = `${days} day${days > 1 ? 's' : ''}`;
        } else {
            document.getElementById("totalAmount").value = 0;
            document.getElementById("displayAmount").textContent = "0";
            document.getElementById("rentalDays").textContent = "0 days";
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
